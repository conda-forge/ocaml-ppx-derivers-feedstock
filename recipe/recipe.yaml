context:
  version: "1.2.1"
  build_number: 3

  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}

package:
  name: ocaml-ppx-derivers
  version: ${{ version }}

source:
  url: https://github.com/ocaml-ppx/ppx_derivers/archive/${{ version }}.tar.gz
  sha256: b6595ee187dea792b31fc54a0e1524ab1e48bc6068d3066c45215a138cc73b95

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script:
    - if: unix
      then:
        - dune build --profile=release -p ppx_derivers @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" ppx_derivers
      else:
        # Plain cmd.exe, not MSYS2 bash: pure OCaml, no stubs, so no wrapper is
        # needed and the backslashed install prefix reaches dune intact. The
        # dune cache trips over mixed path separators on windows.
        - dune build --cache=disabled --profile=release -p ppx_derivers @install
        - if errorlevel 1 exit 1
        - dune install --prefix="%LIBRARY_PREFIX%" --libdir="%LIBRARY_PREFIX%\lib\ocaml" ppx_derivers
        - if errorlevel 1 exit 1

requirements:
  build:
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    # MSVC is activated here, once: ocaml_win-64 >=14 only run-constrains it.
    - if: not unix and c_compiler == "vs2022"
      then:
        - ${{ compiler('c') }}
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name it on windows.
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    - if: build_platform != target_platform
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.*
    - ocaml-dune >=1.0
  host:
    - ocaml ${{ ocaml_compiler_version }}.*
    # The noarch ocaml metapackage does not pin the windows toolchain track.
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
  # The ocaml run_export does not encode the windows toolchain track.
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

tests:
  - package_contents:
      strict: true
      files:
        - ${{ library }}lib/ocaml/ppx_derivers/*
        - ${{ library }}doc/ppx_derivers/*

about:
  homepage: https://github.com/ocaml-ppx/ppx_derivers
  repository: https://github.com/ocaml-ppx/ppx_derivers
  summary: Shared ppx_deriving and ppx_type_conv registry for ppx derivers
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
